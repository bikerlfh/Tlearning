app = "tlearning-api"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.prod"

[env]
LOG_FORMAT = "json"
DJANGO_SETTINGS_MODULE = "tlearning.settings.prod"
PORT = "8000"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["web"]

[[http_service.checks]]
grace_period = "30s"
interval = "30s"
method = "GET"
path = "/api/v1/health"
timeout = "5s"
protocol = "http"

[processes]
web = "sh -c 'python manage.py migrate --noinput && gunicorn tlearning.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60 --access-logfile -'"
worker = "celery -A tlearning worker -l info --concurrency=2"
beat = "celery -A tlearning beat -l info"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
processes = ["web", "worker"]

[[vm]]
size = "shared-cpu-1x"
memory = "128mb"
processes = ["beat"]
