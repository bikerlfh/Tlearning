[project]
name = "tlearning"
version = "0.1.0"
description = "Language learning review app with MCP ingestion"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
    "pydantic>=2.7",
    "django-cors-headers>=4.4",
    "fsrs>=6.3.1",
    "fastmcp>=3.3.1",
    "uvicorn>=0.47.0",
    "celery[redis]>=5.6.3",
    "pywebpush>=2.3.0",
    "gunicorn>=26.0.0",
    "django-allauth[socialaccount]>=65.17.0",
    "sentry-sdk[celery,django]>=2.60.0",
    "python-json-logger>=4.1.0",
    "whitenoise>=6.12.0",
    "dj-database-url>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
disallow_any_generics = false

# Third-party libs without published .pyi stubs / py.typed marker
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "pywebpush.*",
    "fastmcp.*",
    "fsrs.*",
    "pythonjsonlogger.*",
    "allauth.*",
]
ignore_missing_imports = true

# Apps that predate strict-mypy enforcement, plus a handful of view modules
# whose Phase 7/8 additions added DRF method overrides without type annotations.
# Models, serializers, urls in `accounts` remain strict; only `accounts.views`
# is relaxed. Tightening is tracked as Phase 11b cleanup so we don't block this
# release on a 100+ annotation sweep.
[[tool.mypy.overrides]]
module = [
    "mcp_server.*",
    "notifications.*",
    "reviews.*",
    "accounts.views",
    "artifacts.views",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_unimported = false
warn_return_any = false
disable_error_code = ["misc"]

[tool.django-stubs]
django_settings_module = "tlearning.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tlearning.settings.test"
addopts = "--tb=short --strict-markers"
