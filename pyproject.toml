[project]
name = "tlearning"
version = "0.1.0"
description = "Language learning review app with MCP ingestion"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
    "pydantic>=2.7",
    "django-cors-headers>=4.4",
    "fsrs>=6.3.1",
    "fastmcp>=3.3.1",
    "uvicorn>=0.47.0",
    "celery[redis]>=5.6.3",
    "pywebpush>=2.3.0",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
disallow_any_generics = false

[tool.django-stubs]
django_settings_module = "tlearning.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tlearning.settings.test"
addopts = "--tb=short --strict-markers"
