services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tlearning
      POSTGRES_USER: tlearning
      POSTGRES_PASSWORD: tlearning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlearning"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
