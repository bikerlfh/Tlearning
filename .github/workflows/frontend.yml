name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: typecheck + lint + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test:run

  e2e:
    name: playwright critical path
    runs-on: ubuntu-latest
    needs: unit
    env:
      SECRET_KEY: test-secret-for-ci
      DB_NAME: tlearning_test
      DB_USER: tlearning
      DB_PASSWORD: tlearning
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      FRONTEND_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tlearning_test
          POSTGRES_USER: tlearning
          POSTGRES_PASSWORD: tlearning
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tlearning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python manage.py migrate
      - name: Start Django
        run: uv run python manage.py runserver 0.0.0.0:8000 &
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: frontend
        run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
